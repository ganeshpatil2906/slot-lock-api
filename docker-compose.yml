services:
  mysql:
    image: mysql:8.0
    container_name: slotsync-mysql
    environment:
      MYSQL_DATABASE: slotsync
      MYSQL_USER: slotsync
      MYSQL_PASSWORD: slotsync123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
