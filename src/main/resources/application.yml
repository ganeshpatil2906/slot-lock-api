spring:
  application:
    name: slotsync
  datasource:
    url: jdbc:mysql://localhost:3306/slotsync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  hold-default-minutes: ${HOLD_DEFAULT_MINUTES:15} # 15 minutes default hold

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8088

slotsync:
  ai:
    enabled: true
    provider: ${AI_PROVIDER:internal} # internal, gemini, openai
    gemini-api-key: ${GEMINI_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    dynamic-ttl:
      base-minutes: 15
      min-minutes: 2
      max-minutes: 25
    abuse-shield:
      enabled: true
      max-holds-per-minute: 5
      max-concurrent-holds: 3


